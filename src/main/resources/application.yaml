spring:
  application:
    name: url-shortener
    cors:
      origin: http://localhost:5173
  datasource:
    url: jdbc:postgresql://localhost:5432/shortly
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    sql:
      init:
        mode: always

